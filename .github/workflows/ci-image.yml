name: Build And Publish Deployment Image

on:
  push:
    branches:
      - development

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==24.10.0 pytest==9.0.2 flask==3.0.3 pandas==1.4.4 "numpy<2"

      - name: Check formatting
        run: python -m black --check modules/deployment

      - name: Run deployment tests
        run: DEPLOYMENT_SKIP_MODEL_LOAD=1 python -m pytest modules/deployment/tests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
