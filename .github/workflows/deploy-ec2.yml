name: Deploy Deployment Image To EC2

on:
  workflow_run:
    workflows: ["Build And Publish Deployment Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy EC2 runtime files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "modules/deployment/docker-compose.yml"
          target: "~/daredata-challenge"

      - name: Deploy image on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            export DEPLOY_DIR="$HOME/daredata-challenge/modules/deployment"
            mkdir -p "$DEPLOY_DIR/storage"
            cd "$DEPLOY_DIR"

            test -f docker-compose.yml

            cat > .env <<EOF
            DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}
            IMAGE_TAG=sha-${{ github.event.workflow_run.head_sha }}
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            df -h
            docker system df || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            df -h
            docker system df || true
            docker compose pull
            docker compose up -d --force-recreate
            docker compose ps
            sleep 15
            curl --fail http://localhost:5000/health
            curl --fail \
              -X POST http://localhost:5000/predict \
              -H "Content-Type: application/json" \
              -d '{"idx":150000,"features":{"attr_a":1,"attr_b":"c","scd_a":0.55,"scd_b":3}}'
