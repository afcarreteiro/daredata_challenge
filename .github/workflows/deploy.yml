name: Deploy Model API

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==24.10.0 pytest==9.0.2 flask==3.0.3 pandas==1.4.4 "numpy<2"

      - name: Check formatting
        run: python -m black --check modules/deployment

      - name: Run deployment tests
        run: DEPLOYMENT_SKIP_MODEL_LOAD=1 python -m pytest modules/deployment/tests

      - name: Copy deployment bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "modules/deployment,modules/ds/ds_package,modules/ds/models,modules/mle/mle_package"
          target: "~/daredata-challenge"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/daredata-challenge/modules/deployment
            mkdir -p storage
            docker compose down || true
            docker compose up -d --build
            sleep 15
            curl --fail \
              -X POST http://localhost:5000/predict \
              -H "Content-Type: application/json" \
              -d '{"idx":150000,"features":{"attr_a":1,"attr_b":"c","scd_a":0.55,"scd_b":3}}'
