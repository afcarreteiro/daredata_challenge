services:
  prediction-api:
    image: ${DOCKERHUB_IMAGE}:${IMAGE_TAG}
    container_name: prediction-api
    environment:
      - MODEL_DIR=/app/models
      - HOME=/app/runtime
      - PORT=5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./storage:/app/runtime/mle_storage
